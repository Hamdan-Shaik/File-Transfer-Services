flyway.locations=filesystem:schema/fxfer-db/sql
flyway.validateMigrationNaming=true
flyway.sqlMigrationPrefix=V
flyway.repeatableSqlMigrationPrefix=R

# T-009: Each Flyway invocation is per tenant; deployments should set
# `FLYWAY_PLACEHOLDERS_TENANT_ID` so callbacks can write per-tenant audit rows.
flyway.placeholders.tenant_id=unknown

# CI build runs `flyway validate` against a database.
# When a database is empty (no Flyway history table), pending migrations are ignored.
flyway.ignoreMigrationPatterns=*:pending

# Default connection used by CI/build to run `flyway validate` unattended.
# Runtime/deployment injects per-tenant connection details via Flyway env vars
# (FLYWAY_URL/FLYWAY_USER/FLYWAY_PASSWORD), which override these defaults.
flyway.url=jdbc:h2:mem:fxfer;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
flyway.user=sa
flyway.password=
