image:
  repository: fxfer-bff
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80
  targetPort: 8080

ingress:
  enabled: false
  className: ""
  hosts: []

autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 3
  targetCPUUtilizationPercentage: 80

config:
  otlpEndpoint: http://otel-collector:4317
  fxferDomainApiBaseUrl: http://fxfer-domain-api
  corsAllowedOrigins: ""
  authentication:
    authority: ""
    audience: ""
    requireHttpsMetadata: "true"

