module: provider-file-transfer-v2
deployables:
  - name: fxfer-db-schema
    kind: schema
    path: schema/fxfer-db
    stack: PostgreSQL migrations (Flyway)
    role: Per-tenant FXFER database schema migrations.
    build: flyway -configFiles=schema/fxfer-db/flyway.conf validate
    depends_on: []
  - name: fxfer-domain-api
    kind: dotnet-service
    path: services/fxfer-domain-api
    stack: .NET 10 (ASP.NET Core; AOT preferred)
    role: Authoritative command/query APIs for FXFER configuration and tracking.
    build: dotnet build services/fxfer-domain-api
    depends_on: [fxfer-db-schema]
  - name: fxfer-projection-worker
    kind: projector
    path: workers/fxfer-projection-worker
    stack: .NET 10 worker runtime
    role: Builds/updates read models from FXFER domain events.
    build: dotnet build workers/fxfer-projection-worker
    depends_on: [fxfer-domain-api, fxfer-db-schema]
  - name: fxfer-transfer-worker
    kind: worker
    path: workers/fxfer-transfer-worker
    stack: .NET 10 worker runtime
    role: Scheduled execution of protocol I/O and recording outcomes via domain APIs.
    build: dotnet build workers/fxfer-transfer-worker
    depends_on: [fxfer-domain-api]
  - name: fxfer-soap-facade
    kind: dotnet-service
    path: services/fxfer-soap-facade
    stack: .NET 10 (CoreWCF)
    role: SOAP compatibility facade for legacy consumers (no new SOAP functionality).
    build: dotnet build services/fxfer-soap-facade
    depends_on: [fxfer-domain-api]
  - name: fxfer-bff
    kind: bff
    path: services/fxfer-bff
    stack: .NET 10 (Native AOT)
    role: Browser-facing API facade for the FXFER micro-frontend.
    build: dotnet build services/fxfer-bff
    depends_on: [fxfer-domain-api]
  - name: fxfer-mfe
    kind: mfe
    path: apps/fxfer-mfe
    stack: Node.js + Next.js 15 + React 19
    role: Operator UI for FXFER configuration and tracking.
    build: npm --prefix apps/fxfer-mfe ci && npm --prefix apps/fxfer-mfe run build
    depends_on: [fxfer-bff]
