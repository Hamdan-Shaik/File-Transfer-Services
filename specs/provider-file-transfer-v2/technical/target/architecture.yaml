uses:
  - name: Platform identity broker (OIDC)
    path: ''
    role: Issues JWTs for operators; provides authentication context including tenant_id.
  - name: API Gateway (edge)
    path: ''
    role: Validates JWTs/WAF policy; routes browser traffic to FXFER BFF.
  - name: Event Backbone (SNS/SQS pattern)
    path: ''
    role: Tenant-scoped event distribution and durable work item delivery.
  - name: Event Adapter
    path: ''
    role: Publishes/consumes events between FXFER and the Event Backbone.
  - name: Tenant Registry + feature flags
    path: ''
    role: Resolves tenant policies and capability enablement.
  - name: Secrets Manager + KMS
    path: ''
    role: Stores per-tenant database credentials and endpoint secrets.
  - name: Aurora PostgreSQL (per-tenant)
    path: ''
    role: System of record for FXFER configuration and tracking (database-per-tenant).
  - name: External partner endpoints
    path: ''
    role: Protocol endpoints (SFTP/FTPS/HTTPS/etc) reached only by the transfer worker.
  - name: Shared shell (micro-frontend host)
    path: ''
    role: Hosts the FXFER micro-frontend remote module.
flow_order:
  - manage-ftp-servers-and-credentials
  - configure-source-locations-and-destinations
  - manage-integration-files
  - run-file-transfer-batch
  - search-and-track-file-transfers
